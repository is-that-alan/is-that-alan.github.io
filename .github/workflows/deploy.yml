
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Live AI Overview config, all optional — with none set, the site
          # uses the static canned overview.
          # AI_WORKER_URL is not sensitive: keep it as a repo Variable
          # (Settings → Secrets and variables → Actions → Variables).
          NEXT_PUBLIC_AI_WORKER_URL: ${{ vars.AI_WORKER_URL }}
          # GEMINI_API_KEY / OPENROUTER_API_KEY end up embedded in the public
          # JS bundle either way (see lib/ai-config.ts), but must be stored
          # as repo Secrets, not Variables — Variables are plaintext and
          # readable via the API by anyone with repo read access, which is
          # how a prior pair of keys leaked before they were even deployed.
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: alanwong.dev
